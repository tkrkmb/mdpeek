# THIRD_PARTY_NOTICES.md のうち、Rustの依存の部分を作る cargo-about の設定
# 実行ファイルに含まれるものだけを数える（開発用・ビルド時だけの依存は除く）
ignore-dev-dependencies = true
ignore-build-dependencies = true
# mdpeek 自身（publish = false）は載せない
private = { ignore = true }
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"]
# 選べるときは、先に書いたものを選ぶ
accepted = [
    "MIT",
    "MITNFA",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "LGPL-3.0",
]

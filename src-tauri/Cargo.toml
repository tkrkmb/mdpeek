[package]
name = "mdpeek"
version = "0.7.0"
edition = "2021"
rust-version = "1.88.0"
publish = false
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["protocol-asset"] }
tauri-plugin-opener = "=2.5.5"
percent-encoding = "=2.3.2"
async-trait = "=0.1.92"
serde = { version = "=1.0.229", features = ["derive"] }
comrak = "=0.55.0"
nvim-rs = { version = "=0.9.2", features = ["use_tokio"] }
tokio = { version = "=1.53.1", features = ["io-util", "net", "sync"] }
notify = "=8.2.0"
libc = "=0.2.189"

# フォーカスを移さずに窓を前に出すため（Neovim連携での :MdPeek）
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

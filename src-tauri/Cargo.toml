[package]
name = "mdpeek"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["protocol-asset"] }
tauri-plugin-opener = "=2.5.5"
percent-encoding = "=2.3.2"
async-trait = "=0.1.92"
serde = { version = "=1.0.229", features = ["derive"] }
comrak = "=0.55.0"
nvim-rs = { version = "=0.9.2", features = ["use_tokio"] }
tokio = { version = "=1.53.1", features = ["io-util", "net", "sync"] }

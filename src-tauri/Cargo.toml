[package]
name = "mdpeek"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
tauri = "=2.11.6"
async-trait = "=0.1.92"
serde = { version = "=1.0.229", features = ["derive"] }
comrak = "=0.55.0"
nvim-rs = { version = "=0.9.2", features = ["use_tokio"] }
tokio = { version = "=1.53.1", features = ["io-util", "net", "sync"] }

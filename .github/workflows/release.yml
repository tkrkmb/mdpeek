name: release

# v で始まるタグを押したときに動かす。手動でも実行できる。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # LinuxのWebViewはWebKitGTKを使う
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev

      # フロントエンドを先にビルドする（実行ファイルに埋め込まれる）
      - name: Build the frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build the application
        working-directory: src-tauri
        run: cargo build --release

      # 同梱したライブラリのライセンス表示を作る（npm側は、フロントエンドのビルドで書き出される）
      - name: Write the third-party notices
        run: |
          cargo install cargo-about --locked --version 0.9.2 --features cli
          scripts/third-party-notices.sh

      - name: Pack the executable
        id: pack
        run: |
          # 名前に版を含めず、releases/latest/download/ から常に同じ名前で取れるようにする
          name="mdpeek-x86_64-linux"
          mkdir -p "dist/${name}"
          cp src-tauri/target/release/mdpeek README.md LICENSE THIRD_PARTY_NOTICES.md "dist/${name}/"
          cp -R lua "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CHANGELOG.md から、このタグの節を取り出してReleaseの説明にする
          awk -v tag="${GITHUB_REF_NAME}" '
            index($0, "## [" tag "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          # もう一方のジョブが先に作っていれば、説明だけ揃える
          gh release create "${GITHUB_REF_NAME}" --notes-file notes.md \
            || gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
          gh release upload "${GITHUB_REF_NAME}" "${{ steps.pack.outputs.archive }}" --clobber

      # タグ以外（手動実行）では、成果物として残すだけにする
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: mdpeek-x86_64-linux
          path: ${{ steps.pack.outputs.archive }}

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # IntelとApple Siliconの両方に向けてビルドする
      - name: Add the mac targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build the frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build the application
        working-directory: src-tauri
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Write the third-party notices
        run: |
          cargo install cargo-about --locked --version 0.9.2 --features cli
          scripts/third-party-notices.sh

      # 2つの実行ファイルを、1つのユニバーサルバイナリにまとめる
      - name: Pack the executable
        id: pack
        run: |
          name="mdpeek-universal-macos"
          mkdir -p "dist/${name}"
          lipo -create -output "dist/${name}/mdpeek" \
            src-tauri/target/aarch64-apple-darwin/release/mdpeek \
            src-tauri/target/x86_64-apple-darwin/release/mdpeek
          lipo -info "dist/${name}/mdpeek"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "dist/${name}/"
          cp -R lua "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CHANGELOG.md から、このタグの節を取り出してReleaseの説明にする
          awk -v tag="${GITHUB_REF_NAME}" '
            index($0, "## [" tag "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          # もう一方のジョブが先に作っていれば、説明だけ揃える
          gh release create "${GITHUB_REF_NAME}" --notes-file notes.md \
            || gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
          gh release upload "${GITHUB_REF_NAME}" "${{ steps.pack.outputs.archive }}" --clobber

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: mdpeek-universal-macos
          path: ${{ steps.pack.outputs.archive }}

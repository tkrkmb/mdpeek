<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MdPeek</title>
  </head>
  <body>
    <header class="mdpeek-path" aria-label="Current document">
      <div class="mdpeek-path-track"><span class="mdpeek-path-text"></span></div>
    </header>
    <nav class="mdpeek-nav" aria-label="History">
      <button type="button" id="mdpeek-back" aria-label="Back" disabled>‹</button>
      <button type="button" id="mdpeek-forward" aria-label="Forward" disabled>›</button>
    </nav>
    <div class="mdpeek-notice" id="mdpeek-notice" role="status" hidden></div>
    <article class="markdown-body"></article>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
